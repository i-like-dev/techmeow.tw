<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在導向中...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <h1>正在帶您前往目的地</h1>
        <p>頁面應該會自動跳轉，如果沒有反應，請 <a id="redirect-link" href="#">點擊這裡</a>。</p>
    </div>

    <script>
        // --- 設定變數區 ---
        var targetUrl = "https://drive.google.com/file/d/1zBzaEMMmFu2u_9-Hs7NiamMAwG4E4uqm/view?usp=sharing";
        // ----------------

        // 1. 自動修改頁面上的點擊連結
        document.getElementById("redirect-link").href = targetUrl;

        // 2. 執行自動跳轉
        window.location.href = targetUrl;
    </script>

</body>
</html>
