<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技貓開發團隊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        // 日夜模式預加載（避免閃爍）
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; transition: all 0.5s ease; position: relative; }
        /* 隱藏 Chrome, Safari 和 Opera 的滾動條 */
        ::-webkit-scrollbar {
        display: none;
                            }

        /* 隱藏 Firefox 和 IE/Edge 的滾動條 */
        html {
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none;  /* IE and Edge */
            }
        /* 背景裝飾球動畫 */
        .blob { position: absolute; filter: blur(80px); opacity: 0.2; z-index: -1; animation: move 20s infinite alternate; }
        @keyframes move { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }

        /* 日夜配色 */
        .dark body { background-color: #0b0f1a; color: #f8fafc; }
        .light body { background-color: #f0f2f5; color: #1e293b; }

        /* 毛玻璃卡片 */
        .glass-card { 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .dark .glass-card { background: rgba(30, 41, 59, 0.7); }
        .light .glass-card { background: rgba(255, 255, 255, 0.8); border-color: rgba(0,0,0,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        
        .glass-card:hover { transform: scale(1.03) translateY(-10px); border-color: #3b82f6; box-shadow: 0 20px 40px rgba(59, 130, 246, 0.2); }

        #holiday-banner { display: none; text-align: center; padding: 14px; font-weight: 900; color: white; position: sticky; top: 0; z-index: 1000; letter-spacing: 2px; }
        
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden">

    <div class="blob w-96 h-96 bg-blue-600 top-[-10%] left-[-10%]"></div>
    <div class="blob w-80 h-80 bg-purple-600 bottom-[10%] right-[-5%] animation-delay-2000"></div>

    <div id="holiday-banner" class="shadow-2xl"></div>

    <nav class="w-full z-[100] backdrop-blur-xl border-b border-gray-200 dark:border-white/10 bg-white/60 dark:bg-[#0b0f1a]/60 px-8 py-5">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 group cursor-pointer" onclick="window.scrollTo(0,0)">
                <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-2xl group-hover:rotate-[360deg] transition-all duration-700">
                    <i class="fas fa-cat text-white text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black italic tracking-tighter leading-none">科技貓開發 <span class="text-blue-500 uppercase text-lg">團隊</span></h1>
                    <p class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">Technology Archive</p>
                </div>
            </div>
            
            <button onclick="toggleTheme()" class="w-12 h-12 rounded-2xl bg-white dark:bg-white/5 shadow-xl flex items-center justify-center transition-all hover:ring-2 ring-blue-500">
                <i class="fas fa-moon dark:hidden text-slate-700"></i>
                <i class="fas fa-sun hidden dark:block text-yellow-400"></i>
            </button>
        </div>
    </nav>

    <main class="relative z-10 max-w-7xl mx-auto px-8 py-24">
        <header class="mb-24">
            <div class="inline-block px-4 py-1 rounded-full bg-blue-500/10 text-blue-500 text-xs font-black tracking-widest mb-6">EST. 2025</div>
            <h2 class="text-6xl md:text-8xl font-black mb-8 leading-[0.9]">Explore <br><span class="text-blue-600">Archive.</span></h2>
            <p class="max-w-xl text-lg text-gray-500 dark:text-gray-400 leading-relaxed">
                這裡儲存了科技貓所有的專案與研究。我們以貓的敏銳與直覺，重新詮釋冰冷的電子元件。
                <span class="block mt-4 text-red-500 font-bold border-l-4 border-red-500 pl-4">本站純屬個人紀錄，不開放技術支持或專案合作。</span>
            </p>
        </header>
        
        <div id="post-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
            <div id="loader" class="col-span-full py-20 text-center">
                <i class="fas fa-circle-notch loading-spin text-5xl text-blue-500"></i>
                <p class="mt-6 text-gray-400 font-bold tracking-widest uppercase">Connecting to Database...</p>
            </div>
        </div>
    </main>

    <footer id="contact" class="relative z-10 mt-20 py-24 px-8 border-t border-gray-200 dark:border-white/10 bg-white/30 dark:bg-black/20">
        <div class="max-w-5xl mx-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10 text-left">
                <div class="p-10 glass-card rounded-[3rem]">
                    <i class="fas fa-envelope-open-text text-3xl text-blue-500 mb-6"></i>
                    <h4 class="text-xs font-black uppercase tracking-[0.3em] text-gray-400 mb-4">Email Contact</h4>
                    <a href="mailto:hi@tw.techmeow.tw" class="text-2xl font-black hover:text-blue-500 transition break-all">hi@tw.techmeow.tw</a>
                </div>
                <div class="p-10 glass-card rounded-[3rem] border-red-500/20">
                    <i class="fas fa-exclamation-triangle text-3xl text-red-500 mb-6"></i>
                    <h4 class="text-xs font-black uppercase tracking-[0.3em] text-gray-400 mb-4">Bug Tracking</h4>
                    <a id="report-link" href="#" target="_blank" class="text-2xl font-black hover:text-red-500 transition">內容報錯系統 <i class="fas fa-chevron-right ml-2"></i></a>
                </div>
            </div>
            <div class="mt-24 text-center">
                <p class="text-[10px] tracking-[0.8em] text-gray-400 uppercase">© 2025 TechMeow Taiwan. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        // 1. 進階節日偵測 (含 7 天預告)
        function initHolidays() {
            const now = new Date();
            const banner = document.getElementById('holiday-banner');
            const holidays = [
                { m: 1, d: 1, text: "🎆 2026 新年快樂！迎接科技新紀元", color: "#1e3a8a" },
                { m: 1, d: 29, text: "🧧 春節大吉！Code 出平安，年年有餘", color: "#991b1b" },
                { m: 2, d: 14, text: "💖 情人節將至！讓科技擁抱溫度", color: "#9d174d" },
                { m: 4, d: 4, text: "🧸 兒童節將至！保持童心，探索無限", color: "#065f46" },
                { m: 8, d: 8, text: "👔 父親節快樂！", color: "#1e3a8a" },
                { m: 10, d: 10, text: "🇹🇼 國慶佳節慶典中", color: "#b91c1c" },
                { m: 10, d: 31, text: "🎃 萬聖節快樂！小心 Bug 搗蛋", color: "#c2410c" },
                { m: 12, d: 25, text: "🎄 聖誕快樂！Merry Tech-mas!", color: "#064e3b" },
                { m: 12, d: 31, text: "🎊 跨年倒數！準備迎接 2026", color: "#4c1d95" }
            ];

            for (let h of holidays) {
                let hDate = new Date(now.getFullYear(), h.m - 1, h.d);
                let diff = Math.ceil((hDate - now) / (1000 * 60 * 60 * 24));
                if (diff >= 0 && diff <= 7) {
                    banner.style.display = 'block';
                    banner.style.backgroundColor = h.color;
                    banner.innerHTML = diff === 0 ? h.text : `【節日預告】${h.text} (倒數 ${diff} 天)`;
                    break;
                }
            }
        }

        // 2. 表單自動帶入
        document.getElementById('report-link').href = `https://docs.google.com/forms/d/e/1FAIpQLScKPaxc6ijZWKz0LzVakOd79j290zJ3RhAVV50e35nIk-xKqQ/viewform?usp=pp_url&entry.593912212=${encodeURIComponent(window.location.href)}`;

        // 3. 切換主題
        function toggleTheme() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        }

        // 4. 加載文章
// 在 index.html 找到 fetch 的地方，確保路徑如下：
async function loadArchive() {
    const container = document.getElementById('post-container');
    const loader = document.getElementById('loader');
    try {
        // 強制使用相對路徑讀取同級目錄下的 post.json
        const res = await fetch('./post.json', { cache: "no-cache" }); 
        if (!res.ok) throw new Error("Network response was not ok");
        const data = await res.json();
        
        loader.style.display = 'none';
        container.innerHTML = ''; // 清空加載中文字

        data.forEach(p => {
            container.innerHTML += `
                <article class="glass-card rounded-[3rem] p-10 flex flex-col h-full group">
                    <div class="flex justify-between items-start mb-8">
                        <span class="text-[10px] font-black text-blue-500 px-4 py-2 bg-blue-500/10 rounded-full tracking-widest">${p.category}</span>
                        <div class="w-10 h-10 rounded-full flex items-center justify-center bg-gray-500/10 group-hover:bg-blue-500 group-hover:text-white transition-all">
                            <i class="fas fa-arrow-right -rotate-45"></i>
                        </div>
                    </div>
                    <h3 class="text-2xl font-black mb-4 leading-tight group-hover:text-blue-500 transition">${p.title}</h3>
                    <p class="text-gray-400 text-sm leading-relaxed mb-10 flex-grow">${p.description}</p>
                    <div class="flex items-center justify-between pt-6 border-t border-gray-500/10">
                        <span class="text-xs font-mono text-gray-500">#${p.tag}</span>
                        <a href="${p.link}" class="text-sm font-black text-blue-500 hover:tracking-widest transition-all">READ MORE</a>
                    </div>
                </article>
            `;
        });
    } catch (err) {
        loader.innerHTML = `<p class="text-red-500">數據庫讀取失敗：${err.message}</p>`;
    }
}
        window.onload = () => { initHolidays(); loadArchive(); };
    </script>
</body>
</html>
