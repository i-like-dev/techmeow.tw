<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在導向中...</title>

    <meta http-equiv="refresh" content="0; url=https://github.com/i-like-dev">

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="loader"></div>
        <h1>正在帶您前往目的地</h1>
        <p>頁面應該會自動跳轉，如果沒有反應，請 <a href="https://github.com/i-like-dev">點擊這裡</a>。</p>
    </div>

    <script>
        // 請將下方的網址替換成您的目標網址
        var targetUrl = "https://github.com/i-like-dev";
        
        window.location.href = targetUrl;
    </script>

</body>
</html>
