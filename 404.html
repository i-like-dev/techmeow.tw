<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>喵！找不到頁面 | TechMeow TW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        // 同步主站的日夜模式
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; transition: all 0.5s ease; overflow: hidden; }
        
        /* 背景裝飾球 */
        .blob { position: absolute; filter: blur(80px); opacity: 0.2; z-index: -1; animation: move 20s infinite alternate; }
        @keyframes move { from { transform: translate(0, 0); } to { transform: translate(100px, 100px); } }

        .dark body { background-color: #0b0f1a; color: #f8fafc; }
        .light body { background-color: #f0f2f5; color: #1e293b; }

        .glass-container { 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        
        .cat-bounce { animation: bounce 2s infinite ease-in-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }

        .neon-404 { 
            font-size: 12rem; 
            font-weight: 900; 
            line-height: 1; 
            background: linear-gradient(to bottom, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.15;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center">

    <div class="blob w-96 h-96 bg-blue-600 top-[-10%] left-[-10%]"></div>
    <div class="blob w-80 h-80 bg-purple-600 bottom-[10%] right-[-5%]"></div>

    <div class="relative z-10 max-w-2xl w-full px-8">
        <div class="absolute inset-0 flex items-center justify-center -z-10 select-none">
            <span class="neon-404">404</span>
        </div>

        <div class="glass-container rounded-[3rem] p-12 text-center">
            <div class="cat-bounce mb-8">
                <div class="w-24 h-24 bg-gradient-to-br from-blue-500 to-purple-600 rounded-3xl mx-auto flex items-center justify-center shadow-2xl">
                    <i class="fas fa-cat text-white text-5xl"></i>
                </div>
            </div>

            <h1 class="text-3xl md:text-4xl font-black mb-4 uppercase tracking-tight">喵！網頁被叼走了</h1>
            <p class="text-gray-500 dark:text-gray-400 mb-10 leading-relaxed max-w-md mx-auto">
                這個位址目前沒有存放任何小魚乾。<br>
                或許是這條連結已經過期，或者根本還沒建置。
            </p>

            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <a href="index.html" class="bg-blue-600 hover:bg-blue-500 text-white px-10 py-4 rounded-2xl font-black transition-all shadow-xl shadow-blue-500/20 uppercase tracking-widest text-sm">
                    回到傳送門 (首頁)
                </a>
                <a id="report-404" href="#" target="_blank" class="bg-white/5 hover:bg-white/10 border border-white/10 px-10 py-4 rounded-2xl font-black transition-all text-sm uppercase tracking-widest">
                    回報技術貓
                </a>
            </div>
            
            <div class="mt-12 pt-8 border-t border-white/5">
                <p class="text-[10px] text-gray-500 uppercase tracking-[0.5em]">Error Code: ERR_CAT_NOT_FOUND</p>
            </div>
        </div>
    </div>

    <script>
        // 自動配置報錯連結，並加上 404 標記
        const currentUrl = window.location.href;
        const reportBaseUrl = "https://docs.google.com/forms/d/e/1FAIpQLScKPaxc6ijZWKz0LzVakOd79j290zJ3RhAVV50e35nIk-xKqQ/viewform?usp=pp_url&entry.593912212=";
        document.getElementById('report-404').href = reportBaseUrl + encodeURIComponent("[404 ERROR] " + currentUrl);
    </script>
</body>
</html>
